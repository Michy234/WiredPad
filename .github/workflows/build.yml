name: Linux packages
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --needed --noconfirm cmake git ffmpeg libdrm libusbmuxd libimobiledevice libplist qt6-base qt6-svg usbmuxd dkms linux-headers
      - uses: actions/checkout@v4
      - name: Build driver and test WiredPad
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          # makepkg needs a writable checkout and an unprivileged account.
          cp -a "$GITHUB_WORKSPACE" /home/builder/WiredPad
          chown -R builder:builder /home/builder/WiredPad
          cd /home/builder/WiredPad/packaging/arch/evdi-wiredpad-dkms
          runuser -u builder -- makepkg
          driver=(evdi-wiredpad-dkms-*.pkg.tar.zst)
          pacman -U --noconfirm "${driver[@]}"
          cd ..
          runuser -u builder -- makepkg
          mkdir "$GITHUB_WORKSPACE/packages"
          cp wiredpad-[0-9]*.pkg.tar.zst "evdi-wiredpad-dkms/${driver[0]}" "$GITHUB_WORKSPACE/packages/"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: packages/*.pkg.tar.zst
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Install Flatpak Builder
        run: pacman -Syu --needed --noconfirm flatpak-builder git
      - uses: actions/checkout@v4
      - name: Build and test Flatpak
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --install-deps-from=flathub --run-tests --repo=dist/flatpak-repo \
            dist/flatpak-build packaging/flatpak/io.github.Michy234.WiredPad.json
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            dist/flatpak-repo dist/WiredPad-x86_64.flatpak io.github.Michy234.WiredPad
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/WiredPad-x86_64.flatpak
          if-no-files-found: error

  release:
    needs: [arch, flatpak]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: packages
      - name: Publish tested packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="arch-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.pkg.tar.zst packages/*.flatpak --clobber
          else
            flags=(--prerelease)
            if [[ "$GITHUB_REF_NAME" == main ]]; then flags=(--latest); fi
            gh release create "$tag" packages/*.pkg.tar.zst packages/*.flatpak --target "$GITHUB_SHA" \
              --title "WiredPad · Linux build $GITHUB_RUN_NUMBER" "${flags[@]}" \
              --notes $'**Flatpak**: Install `WiredPad-x86_64.flatpak` with `flatpak install --user ./WiredPad-x86_64.flatpak`. The bundle requires EVDI, usbmuxd and access to /dev/uinput on the host.\n\n**Arch**: Install matching kernel headers, download both .pkg.tar.zst files into an empty directory and run `sudo pacman -U ./*.pkg.tar.zst`.'
          fi
